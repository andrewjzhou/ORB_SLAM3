%YAML:1.0

#--------------------------------------------------------------------------------------------
# INDEMIND Stereo-Inertial Camera
# Calibrated with Kalibr on 2026-04-01
# Camera model: KannalaBrandt8 (equidistant, Kannala-Brandt)
# Resolution: 640x400, 50 Hz | IMU: 1000 Hz | Baseline: ~120mm
# Camera-IMU time offset: t_imu = t_cam + 0.0236s (23.6ms, cam lags IMU clock)
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "KannalaBrandt8"

# Left camera (cam0) intrinsics
Camera1.fx: 244.43827101503615
Camera1.fy: 244.7812173789584
Camera1.cx: 313.7749959798858
Camera1.cy: 196.18709630030062

# Kannala-Brandt distortion (equidistant k1..k4)
Camera1.k1:  0.6010303932593088
Camera1.k2:  0.16087504019037505
Camera1.k3: -0.573130127526272
Camera1.k4:  0.2727761639205214

# Right camera (cam1) intrinsics
Camera2.fx: 245.447884079221
Camera2.fy: 245.61155830652933
Camera2.cx: 324.0004718630311
Camera2.cy: 201.47014779574567

# Kannala-Brandt distortion (equidistant k1..k4)
Camera2.k1:  0.601482764276272
Camera2.k2:  0.1728278386867737
Camera2.k3: -0.6398394171404175
Camera2.k4:  0.33468846566031

# Transformation from right camera (cam1) to left camera (cam0)
# = inverse of Kalibr T_cn_cnm1 (cam1 entry in visual-camchain.yaml)
Stereo.T_c1_c2: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [ 0.999961518, -0.00201283831, -0.00853882684,  0.119824852,
          0.00206317562,  0.999980523,  0.00589040094,  0.0000714469844,
          0.00852680411, -0.00590779136,  0.999946194,  0.000320564443,
          0.0, 0.0, 0.0, 1.0 ]

# Overlapping columns between left and right image (full width — refine if needed)
Camera1.overlappingBegin: 0
Camera1.overlappingEnd: 639

Camera2.overlappingBegin: 0
Camera2.overlappingEnd: 639

# Camera resolution
Camera.width: 640
Camera.height: 400

# Camera frames per second
Camera.fps: 50

# Color order (0: BGR, 1: RGB — ignored for grayscale)
Camera.RGB: 0

# Close/Far threshold in baseline units (120mm baseline; 40x = 4.8m)
Stereo.ThDepth: 40.0

#--------------------------------------------------------------------------------------------
# IMU Parameters
#--------------------------------------------------------------------------------------------

# Transformation from IMU to left camera (cam0)
# = inverse of Kalibr T_cam_imu (cam0 entry in inertial-camchain-imucam.yaml)
IMU.T_b_c1: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [-0.999971907, -0.000594563636, -0.00747204197,  0.0604770297,
          0.000559041915, -0.999988538,  0.00475514075, -0.000330435237,
         -0.00747478356,  0.00475082998,  0.999960778,  0.00654418100,
          0.0, 0.0, 0.0, 1.0 ]

# IMU noise parameters — from INDEMIND device firmware (GetModuleParams()._imu)
# Tip: if IMU initialization fails to converge, multiply NoiseGyro/NoiseAcc by 10
IMU.NoiseGyro:  0.002094   # rad/s/√Hz  (firmware: 0.12 deg/s/√Hz * pi/180)
IMU.NoiseAcc:   0.08829    # m/s²/√Hz   (firmware: 0.009 g/√Hz * 9.81)
IMU.GyroWalk:   0.0000006981   # rad/s/√s   (firmware: 4e-5 deg/s/√s * pi/180)
IMU.AccWalk:    0.0003924      # m/s²/√s    (firmware: 4e-5 g/√s * 9.81)
IMU.Frequency:  1000.0

# IMU initialization motion thresholds (relaxed for slow INDEMIND recordings)
# Upstream defaults: 0.05 / 0.02 — good for fast handheld motion
IMU.thImuInitDist: 0.01       # min keyframe-pair distance to accumulate init time
IMU.thImuInitMinDist: 0.005   # below this distance + mTinit<10s → reset map

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
